<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Theme Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <div class="container font-arial">
        <h1>Welcome to My Website</h1>
        <p>This is a paragraph using the default font and theme.</p>
        <p class="font-helvetica-neue">This is a paragraph using the Helvetica Neue font.</p>
        <p class="font-verdana">This is a paragraph using the Verdana font.</p>
        <p class="light-text">This is a paragraph using light text.</p>
        <p class="medium-text">This is a paragraph using medium grey text.</p>
        <p class="darker-text">This is a paragraph using dark text.</p>
    </div>
</body>
</html>
